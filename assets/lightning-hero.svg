<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img">
<title>闪电加速器品牌纸雕插画</title>
<desc>带折面的闪电丝带，以几何形状表达明快节奏。 原创可编辑矢量图，无外部素材。</desc>
<defs>
  <linearGradient id="lightning-paper" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#ffffff"/><stop offset=".6" stop-color="#f7f9f8"/><stop offset="1" stop-color="#e5ebe7"/></linearGradient>
  <linearGradient id="lightning-accent" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#d1b388"/><stop offset="1" stop-color="#a56a16"/></linearGradient>
  <linearGradient id="lightning-accentSoft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4ede3"/><stop offset=".5" stop-color="#e8dac5"/><stop offset="1" stop-color="#d0b286"/></linearGradient>
  <linearGradient id="lightning-leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#abb79a"/><stop offset="1" stop-color="#5f785b"/></linearGradient>
  <linearGradient id="lightning-ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#536058"/><stop offset=".6" stop-color="#303c35"/><stop offset="1" stop-color="#19231d"/></linearGradient>
  <filter id="lightning-shadow" x="-35%" y="-35%" width="170%" height="190%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#35443c" flood-opacity=".12"/></filter>
  <filter id="lightning-smallshadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#35443c" flood-opacity=".1"/></filter>
  <filter id="lightning-blur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="800" height="600" fill="#fff"/>
<ellipse cx="406" cy="521" rx="192" ry="17" fill="#273933" opacity=".075" filter="url(#lightning-blur)"/>
<path d="M201 194c16-35 42-58 81-68M542 418c35-17 58-39 74-72" fill="none" stroke="#e6dfd2" stroke-width="2" stroke-linecap="round"/>
<g filter="url(#lightning-shadow)">
  <path d="m431 89 129 15-111 148 97 12-237 255 58-187-104-13Z" fill="url(#lightning-accentSoft)"/>
  <path d="m560 104 20 17-111 149-20-18Z" fill="url(#lightning-accent)"/>
  <path d="m546 264 20 17-237 255-20-17Z" fill="url(#lightning-accent)"/>
  <path d="m367 332 20 17-58 187-20-17Z" fill="#c2a778"/>
  <path d="m263 319 20 17 104 13-20-17Z" fill="#b7a88c"/>
  <path d="m431 89 129 15-111 148 97 12-157 169 52-154-99-11Z" fill="url(#lightning-paper)"/>
  <path d="m342 268 99 11 8-27 111-148-52 35Z" fill="#f2e7d3"/>
  <path d="m389 433-80 86 58-187 74-53Z" fill="url(#lightning-accentSoft)"/>
</g>
<g transform="translate(176 368) rotate(-15)" filter="url(#lightning-smallshadow)">
  <path d="m0 0 49-5-20 33 32-3-65 74 19-50-25 3Z" fill="url(#lightning-paper)" stroke="#e6decd"/>
</g>
<path d="m602 161 15-16 17 16-17 16Z" fill="url(#lightning-accentSoft)"/>

</svg>
